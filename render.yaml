services:
  - type: web
    name: tg-alerts
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: PRICE_SOURCE
        value: oanda
      - key: OANDA_ENV
        value: practice
      - key: OANDA_SIDE
        value: mid
      - key: OANDA_TOKEN
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
