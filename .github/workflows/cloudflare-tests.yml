name: Cloudflare checks
on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'cloudflare/**'
      - 'public/**'
      - 'shared/**'
      - 'h4*'
      - 'live*'
      - 'package*.json'
      - 'wrangler.jsonc'
      - 'test/**'
      - '.github/workflows/cloudflare-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update -qq && sudo apt-get install -y redis-server
      - run: npm test
      - run: npm run test:cloudflare
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Install browser
        run: node node_modules/playwright-core/cli.js install --with-deps chromium
      - name: Configure browser path
        run: |
          node -e "console.log('CHROMIUM_PATH=' + require('playwright-core').chromium.executablePath())" >> "$GITHUB_ENV"
      - run: npm run test:browser
